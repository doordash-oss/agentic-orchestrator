openapi: 3.1.0
info:
  title: Agentico Server API
  version: v1
  description: Loopback REST and SSE API for the Agentico headless runtime.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read runtime health and launch metadata.
      description: >-
        Liveness-only endpoint (status, runtime identity, launch policy,
        start time, owner — no secrets). Intentionally exempt from bearer
        auth so that a stale discovery token can't make a live, healthy
        server look dead to PrepareDiscovery.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features:
    get:
      operationId: listFeatures
      summary: List feature dashboard summaries.
      responses:
        "200":
          $ref: "#/components/responses/FeatureListResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFeature
      summary: Create a feature.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "201":
          $ref: "#/components/responses/ActionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}:
    get:
      operationId: getFeature
      summary: Read one feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/FeatureDetailResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/config:
    get:
      operationId: getFeatureConfig
      summary: Read feature configuration.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/FeatureConfigResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: updateFeatureConfig
      summary: Update feature configuration.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/live-preview:
    get:
      operationId: getFeatureLivePreview
      summary: Read a feature's compact live preview.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/LivePreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/start:
    post:
      operationId: startFeatureLegacy
      summary: Start or resume a feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/resume:
    post:
      operationId: resumeFeatureLegacy
      summary: Resume a feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/stop:
    post:
      operationId: stopFeatureLegacy
      summary: Stop a feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/interrupt:
    post:
      operationId: interruptFeatureLegacy
      summary: Interrupt a feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/restart:
    post:
      operationId: restartFeatureLegacy
      summary: Restart a feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/review-decision:
    post:
      operationId: submitReviewDecisionLegacy
      summary: Submit a review decision.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/need-user-input:
    post:
      operationId: answerNeedUserInputLegacy
      summary: Submit a need-user-input gate decision.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/need-user-input-draft:
    post:
      operationId: draftNeedUserInputLegacy
      summary: Generate draft answers for a need-user-input gate.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/input-notifications:
    post:
      operationId: toggleInputNotificationsLegacy
      summary: Toggle feature input notifications.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/actions/{action}:
    post:
      operationId: runFeatureAction
      summary: Run a named feature action.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/FeatureAction"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/actions/{action}/{subaction}:
    post:
      operationId: runFeatureSubaction
      summary: Run a named feature subaction.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/FeatureAction"
        - $ref: "#/components/parameters/FeatureSubaction"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts for one feature run.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
      responses:
        "200":
          $ref: "#/components/responses/ArtifactListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/artifacts/{artifact_id}:
    get:
      operationId: getArtifactContent
      summary: Read a bounded text artifact slice.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
        - $ref: "#/components/parameters/ArtifactID"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/logs/{log_id}:
    get:
      operationId: getRunLogContent
      summary: Read a bounded run log slice.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
        - $ref: "#/components/parameters/LogID"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/config/runtime:
    get:
      operationId: getRuntimeConfig
      summary: Read runtime configuration.
      responses:
        "200":
          $ref: "#/components/responses/RuntimeConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchRuntimeConfig
      summary: Patch runtime configuration.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRuntimeConfig
      summary: Replace runtime configuration.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/workspace/browse:
    get:
      operationId: browseWorkspace
      summary: Browse workspace paths.
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceBrowseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/catalog/models:
    get:
      operationId: listModels
      summary: List available provider models.
      responses:
        "200":
          $ref: "#/components/responses/ModelCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts:
    get:
      operationId: listPrompts
      summary: List pending prompt requests.
      responses:
        "200":
          $ref: "#/components/responses/PromptSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/ask-user/answer:
    post:
      operationId: answerAskUserPrompt
      summary: Answer an ask-user prompt.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/help/send:
    post:
      operationId: sendHelpPrompt
      summary: Send a help message to a session.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/chat/start:
    post:
      operationId: startChatPrompt
      summary: Start a chat prompt session.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List pending permission requests.
      responses:
        "200":
          $ref: "#/components/responses/PermissionSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/permissions/answer:
    post:
      operationId: answerPermission
      summary: Answer a permission request.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List active and recent sessions.
      responses:
        "200":
          $ref: "#/components/responses/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Read a session summary.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          $ref: "#/components/responses/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}/transcript:
    get:
      operationId: getSessionTranscript
      summary: Read a bounded structured session transcript.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TranscriptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}/output:
    get:
      operationId: getSessionOutput
      summary: Read a bounded byte slice from the append-only session output log.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SessionOutputResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}/output/stream:
    get:
      operationId: streamSessionOutput
      summary: Stream indexed transcript records as SSE.
      description: >-
        Emits `session.output` events carrying structured `SessionOutputChunk`
        records — the same transcript rows and index space `/transcript`
        returns — and a terminal `session.output.done` event.
      security:
        - bearerAuth: []
        - sseAccessToken: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: from
          in: query
          required: false
          description: >-
            Resume position expressed as a transcript row index (the same
            index space `/transcript` uses), not a byte offset.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/SessionOutputStream"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recovery:
    get:
      operationId: getRecoverySnapshot
      summary: Scan recoverable sessions.
      responses:
        "200":
          $ref: "#/components/responses/RecoverySnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recovery/actions:
    post:
      operationId: executeRecoveryActions
      summary: Execute recovery actions from a recovery snapshot.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/shutdown:
    post:
      operationId: shutdownRuntime
      summary: Request runtime shutdown.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Stream ordered runtime events as SSE.
      description: Emits envelope JSON under SSE `data:` lines. Every non-control event includes a monotonic `seq`, `epoch`, resource identity, and resource version. Clients resume with `Last-Event-ID` or `after`.
      security:
        - bearerAuth: []
        - sseAccessToken: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            x-go-type: uint64
            minimum: 0
        - name: epoch
          in: query
          required: false
          schema:
            type: string
        - name: heartbeat_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: instance-token
      description: Per-instance token from discovery metadata.
    sseAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: SSE fallback for browser EventSource clients that cannot set Authorization.

  parameters:
    FeatureID:
      name: feature_id
      in: path
      required: true
      schema:
        type: string
    RunNumber:
      name: run_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
    LogID:
      name: log_id
      in: path
      required: true
      schema:
        type: string
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    FeatureAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum:
          - start
          - resume
          - pause-stop
          - restart
          - publish
          - merge
          - rewind
          - retry
          - rebase
          - review-comments
          - tweak
          - refactor
          - mark-done
          - cleanup
          - delete
    FeatureSubaction:
      name: subaction
      in: path
      required: true
      schema:
        type: string
        enum:
          - description
          - fetch
          - finish
          - restart
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    TrustedMutationHeader:
      name: X-Agentico-Client
      in: header
      required: true
      schema:
        type: string
        enum: ["local"]
      description: CSRF defense-in-depth for local browser-origin mutations. Bearer auth is still required.

  requestBodies:
    JSONMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    HealthResponse:
      description: Runtime health.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    FeatureListResponse:
      description: Feature list.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureListResponse"
    FeatureDetailResponse:
      description: Feature detail.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureDetailResponse"
    FeatureConfigResponse:
      description: Feature config.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureConfigResponse"
    RuntimeConfigResponse:
      description: Runtime config.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeConfigResponse"
    WorkspaceBrowseResponse:
      description: Workspace browse result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkspaceBrowseResponse"
    ModelCatalogResponse:
      description: Model catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelCatalogResponse"
    PromptSnapshotResponse:
      description: Pending prompt snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptSnapshotResponse"
    PermissionSnapshotResponse:
      description: Pending permission snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionSnapshotResponse"
    ArtifactListResponse:
      description: Artifact list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactListResponse"
    TextContentResponse:
      description: Bounded text content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TextContentResponse"
    LivePreviewResponse:
      description: Live preview.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LivePreviewResponse"
    SessionListResponse:
      description: Session list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionListResponse"
    SessionDetailResponse:
      description: Session detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionDetailResponse"
    TranscriptResponse:
      description: Structured transcript.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscriptResponse"
    SessionOutputResponse:
      description: Append-only output backfill.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionOutputResponse"
    RecoverySnapshotResponse:
      description: Recovery snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecoverySnapshotResponse"
    ActionResponse:
      description: Mutation result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionResponse"
    ErrorResponse:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotModified:
      description: Snapshot revision matches the supplied validator.
    EventStream:
      description: Runtime SSE stream carrying `SSEEvent` JSON envelopes.
      content:
        text/event-stream:
          schema:
            type: string
    SessionOutputStream:
      description: Session output SSE stream carrying `SessionOutputChunk` JSON payloads.
      content:
        text/event-stream:
          schema:
            type: string

  headers:
    Sequence:
      description: Current event broker sequence at response time.
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Snapshot revision validator.
      schema:
        type: string

  schemas:
    ResponseMeta:
      type: object
      required: [revision, generated_at, as_of_seq]
      properties:
        revision:
          type: string
        generated_at:
          type: string
          format: date-time
        as_of_seq:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
    ErrorResponse:
      type: object
      required: [api_version, error]
      properties:
        api_version:
          type: string
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message, status]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        target:
          type: object
          additionalProperties: true
    Resource:
      type: object
      required: [type]
      properties:
        type:
          type: string
        id:
          type: string
        feature_id:
          type: string
        phase:
          type: string
    SSEEvent:
      type: object
      required: [api_version, id, kind, at, resource, snapshot_required]
      properties:
        api_version:
          type: string
        id:
          type: string
        seq:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
        epoch:
          type: string
        kind:
          type: string
        at:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/Resource"
        resource_version:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
        revision:
          type: string
        snapshot_required:
          type: boolean
        summary:
          type: string
        record_count:
          type: integer
          description: >-
            Session's current transcript record count at emission time — the
            same index space /transcript and /output/stream use. Only set on
            session.output.activity events.
    SessionOutputChunk:
      type: object
      required: [index]
      properties:
        session_id:
          type: string
        index:
          type: integer
          description: >-
            Transcript row index — the same index space /transcript and
            session.output.activity's record_count use. Not a byte offset.
        message:
          type: object
          description: A TranscriptMessageDTO row (see the /transcript response).
        done:
          type: boolean
    SessionOutputResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [session_id, offset, next_offset, size, data, truncated, done]
          properties:
            session_id:
              type: string
            offset:
              type: integer
              format: int64
              minimum: 0
            next_offset:
              type: integer
              format: int64
              minimum: 0
            size:
              type: integer
              format: int64
              minimum: 0
            data:
              type: string
            truncated:
              type: boolean
            done:
              type: boolean
    # JSONResponse is the untyped fallback for response schemas not yet
    # converted to a typed shape. Tracked remainder (convert opportunistically,
    # not required for any specific task):
    #   ActionResponse, ArtifactListResponse, FeatureConfigResponse,
    #   HealthResponse, LivePreviewResponse, ModelCatalogResponse,
    #   PermissionSnapshotResponse, PromptSnapshotResponse,
    #   RecoverySnapshotResponse, RuntimeConfigResponse, TextContentResponse,
    #   TranscriptResponse, WorkspaceBrowseResponse.
    # FeatureListResponse, FeatureDetailResponse, SessionListResponse, and
    # SessionDetailResponse were converted 2026-07-09.
    JSONResponse:
      type: object
      required: [api_version]
      properties:
        api_version:
          type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      additionalProperties: true
    HealthResponse:
      $ref: "#/components/schemas/JSONResponse"
    FeatureListResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [features]
          additionalProperties: true
          properties:
            features:
              type: array
              items:
                $ref: "#/components/schemas/FeatureSummary"
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/Warning"
    FeatureDetailResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [feature]
          additionalProperties: true
          properties:
            feature:
              $ref: "#/components/schemas/FeatureDetail"
    FeatureConfigResponse:
      $ref: "#/components/schemas/JSONResponse"
    RuntimeConfigResponse:
      $ref: "#/components/schemas/JSONResponse"
    WorkspaceBrowseResponse:
      $ref: "#/components/schemas/JSONResponse"
    ModelCatalogResponse:
      $ref: "#/components/schemas/JSONResponse"
    PromptSnapshotResponse:
      $ref: "#/components/schemas/JSONResponse"
    PermissionSnapshotResponse:
      $ref: "#/components/schemas/JSONResponse"
    ArtifactListResponse:
      $ref: "#/components/schemas/JSONResponse"
    TextContentResponse:
      $ref: "#/components/schemas/JSONResponse"
    LivePreviewResponse:
      $ref: "#/components/schemas/JSONResponse"
    SessionListResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [sessions]
          additionalProperties: true
          properties:
            sessions:
              type: array
              items:
                $ref: "#/components/schemas/SessionSummary"
    SessionDetailResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [session]
          additionalProperties: true
          properties:
            session:
              $ref: "#/components/schemas/SessionDetail"
    TranscriptResponse:
      $ref: "#/components/schemas/JSONResponse"
    RecoverySnapshotResponse:
      $ref: "#/components/schemas/JSONResponse"
    ActionResponse:
      $ref: "#/components/schemas/JSONResponse"

    # --- Feature/session payload types backing FeatureListResponse,
    # FeatureDetailResponse, SessionListResponse, SessionDetailResponse.
    # Mirror internal/server/types.go field-for-field.
    Warning:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        feature_id:
          type: string
        message:
          type: string
    Cycle:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        status:
          type: string
        count:
          type: integer
        iteration:
          type: integer
    Checkpoints:
      type: object
      additionalProperties: true
      required:
        - inquiry_review
        - research_review
        - design_review
        - roadmap_review
        - phase_plan_review
        - manual_publish
        - draft_publish
      properties:
        inquiry_review:
          type: boolean
        research_review:
          type: boolean
        design_review:
          type: boolean
        roadmap_review:
          type: boolean
        phase_plan_review:
          type: boolean
        manual_publish:
          type: boolean
        draft_publish:
          type: boolean
    FeatureProgress:
      type: object
      additionalProperties: true
      properties:
        current_iteration:
          type: integer
        current_roadmap_phase:
          type: integer
        total_roadmap_phases:
          type: integer
        current_phase_status:
          type: string
    FeatureSummary:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - slug
        - status
        - current_phase
        - active_run
        - run_count
        - repos
        - created_at
        - checkpoints
        - progress
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        current_phase:
          type: string
        cycle:
          $ref: "#/components/schemas/Cycle"
        active_run:
          type: integer
        run_count:
          type: integer
        repos:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        checkpoints:
          $ref: "#/components/schemas/Checkpoints"
        progress:
          $ref: "#/components/schemas/FeatureProgress"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    ModelDefaults:
      type: object
      additionalProperties: true
      properties:
        inquiry:
          type: string
        research:
          type: string
        planning:
          type: string
        implementation:
          type: string
        review:
          type: string
        utilities:
          type: string
        kb_build:
          type: string
    Timing:
      type: object
      additionalProperties: true
      required: [total_seconds, by_phase]
      properties:
        total_seconds:
          type: integer
          format: int64
        by_phase:
          type: object
          additionalProperties:
            type: integer
            format: int64
    Cost:
      type: object
      additionalProperties: true
      required: [total_usd, by_phase]
      properties:
        total_usd:
          type: number
          format: double
        by_phase:
          type: object
          additionalProperties:
            type: number
            format: double
    ReviewGate:
      type: object
      additionalProperties: true
      required: [reviewing_gate, review_fixing, validating_plan]
      properties:
        reviewing_gate:
          type: boolean
        review_fixing:
          type: boolean
        validating_plan:
          type: boolean
        validator_statuses:
          type: object
          additionalProperties:
            type: string
    Failure:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        message:
          type: string
    NeedUserInputGate:
      type: object
      additionalProperties: true
      required: [open]
      properties:
        feature_id:
          type: string
        open:
          type: boolean
        scope:
          type: string
        iteration:
          type: integer
    RepoStatus:
      type: object
      additionalProperties: true
      required: [name, touched, publishable]
      properties:
        name:
          type: string
        freshness:
          type: string
        rebase_status:
          type: string
        rebase_target:
          type: string
        conflict_files:
          type: array
          items:
            type: string
        touched:
          type: boolean
        pr_url:
          type: string
        last_error:
          type: string
        publishable:
          type: boolean
        cycle_type:
          type: string
        cycle_status:
          type: string
    RunSummary:
      type: object
      additionalProperties: true
      required: [run_number, artifact_count]
      properties:
        run_number:
          type: integer
        started_at:
          type: string
          format: date-time
        sealed_at:
          type: string
          format: date-time
        seal_reason:
          type: string
        current_phase:
          type: string
        phase_status:
          type: string
        iteration:
          type: integer
        roadmap_phase:
          type: integer
        roadmap_total:
          type: integer
        pending_review_phase:
          type: string
        pending_rewind_review_roadmap_phase:
          type: integer
        is_rewind:
          type: boolean
        artifact_count:
          type: integer
        has_need_user_gate:
          type: boolean
        setup:
          type: object
          description: >-
            SetupDTO — untyped for now (see the tracked JSONResponse
            remainder note above; nested setup/task detail is not yet
            typed).
          additionalProperties: true
    ActionScope:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
        repo_selection:
          type: string
        cycle_type:
          type: string
    ActionInput:
      type: object
      additionalProperties: true
      required: [name, kind, required]
      properties:
        name:
          type: string
        kind:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
        max_length:
          type: integer
    ActionDisabledReason:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Action:
      type: object
      additionalProperties: true
      required: [id, enabled, scope, required_inputs]
      properties:
        id:
          type: string
        enabled:
          type: boolean
        scope:
          $ref: "#/components/schemas/ActionScope"
        required_inputs:
          type: array
          items:
            $ref: "#/components/schemas/ActionInput"
        disabled_reasons:
          type: array
          items:
            $ref: "#/components/schemas/ActionDisabledReason"
    FeatureDetail:
      allOf:
        - $ref: "#/components/schemas/FeatureSummary"
        - type: object
          additionalProperties: true
          required:
            - models
            - historical_runs
            - repo_status
            - timing
            - cost
            - review_gate
            - actions
            - revision
            - cache_revalidate
          properties:
            description:
              type: string
            summary:
              type: string
            pipeline:
              type: string
            models:
              $ref: "#/components/schemas/ModelDefaults"
            active_run_detail:
              $ref: "#/components/schemas/RunSummary"
            historical_runs:
              type: array
              items:
                $ref: "#/components/schemas/RunSummary"
            repo_status:
              type: array
              items:
                $ref: "#/components/schemas/RepoStatus"
            cycle:
              $ref: "#/components/schemas/Cycle"
            timing:
              $ref: "#/components/schemas/Timing"
            cost:
              $ref: "#/components/schemas/Cost"
            review_gate:
              $ref: "#/components/schemas/ReviewGate"
            failure:
              $ref: "#/components/schemas/Failure"
            need_user_input:
              $ref: "#/components/schemas/NeedUserInputGate"
            actions:
              type: array
              items:
                $ref: "#/components/schemas/Action"
            revision:
              type: string
            cache_revalidate:
              type: string
    Usage:
      type: object
      additionalProperties: true
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost_usd:
          type: number
          format: double
    SessionSummary:
      type: object
      additionalProperties: true
      required:
        - id
        - feature_id
        - phase
        - kind
        - status
        - started_at
        - usage
      properties:
        id:
          type: string
        feature_id:
          type: string
        phase:
          type: string
        repo:
          type: string
        kind:
          type: string
        label:
          type: string
        provider:
          type: string
        model:
          type: string
        status:
          type: string
        turn_state:
          type: string
        started_at:
          type: string
          format: date-time
        iteration:
          type: integer
        context_percentage:
          type: integer
        usage:
          $ref: "#/components/schemas/Usage"
    Cursor:
      type: object
      additionalProperties: true
      required: [total, start, end]
      properties:
        total:
          type: integer
        start:
          type: integer
        end:
          type: integer
    AskUserOption:
      type: object
      additionalProperties: true
      properties:
        label:
          type: string
        description:
          type: string
        confidence:
          type: number
          format: double
    AskUserQuestion:
      type: object
      additionalProperties: true
      properties:
        question:
          type: string
        header:
          type: string
        multi_select:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/AskUserOption"
    ControlRequest:
      type: object
      additionalProperties: true
      required: [request_id, tool_name, status]
      properties:
        request_id:
          type: string
        session_id:
          type: string
        feature_id:
          type: string
        phase:
          type: string
        tool_name:
          type: string
        status:
          type: string
        summary:
          type: string
        input:
          type: object
          additionalProperties: true
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AskUserQuestion"
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          additionalProperties: true
          required:
            - transcript_cursor
            - pending_controls
            - can_attach
            - log_available
          properties:
            transcript_cursor:
              $ref: "#/components/schemas/Cursor"
            pending_controls:
              type: array
              items:
                $ref: "#/components/schemas/ControlRequest"
            initial_prompt:
              type: string
            can_attach:
              type: boolean
            log_available:
              type: boolean
            safe_error:
              type: string
