<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f7f6f4"/><stop offset="1" stop-color="#eceae5"/>
    </linearGradient>
    <linearGradient id="legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8474d"/><stop offset="1" stop-color="#d63f4a"/>
    </linearGradient>
    <linearGradient id="legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8474d"/><stop offset="1" stop-color="#7c4370"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07a3a"/><stop offset="1" stop-color="#4b4f79"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6288"/><stop offset="1" stop-color="#3b4067"/>
    </linearGradient>
    <linearGradient id="strut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9a2f"/><stop offset="1" stop-color="#e8822c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="512" cy="492" r="316" fill="none" stroke="#dcd8d0" stroke-width="3"/>
    <circle cx="270" cy="250" r="4.5" fill="#cbc6bc"/><circle cx="760" cy="220" r="4.5" fill="#cbc6bc"/><circle cx="820" cy="420" r="4.5" fill="#cbc6bc"/><circle cx="220" cy="480" r="4.5" fill="#cbc6bc"/><circle cx="300" cy="850" r="4.5" fill="#cbc6bc"/><circle cx="740" cy="860" r="4.5" fill="#cbc6bc"/><circle cx="640" cy="160" r="4.5" fill="#cbc6bc"/><circle cx="180" cy="660" r="4.5" fill="#cbc6bc"/>

    <!-- orbital arcs through the crossbar -->
    <path d="M326,696 Q512,532 698,696" fill="none" stroke="url(#arc2)" stroke-width="44" stroke-linecap="round"/>
    <path d="M326,696 Q512,344 698,696" fill="none" stroke="url(#arc1)" stroke-width="44" stroke-linecap="round"/>

    <!-- A frame -->
    <path d="M512,258 L326,696" fill="none" stroke="url(#legL)" stroke-width="56" stroke-linecap="round"/>
    <path d="M512,258 L698,696" fill="none" stroke="url(#legR)" stroke-width="56" stroke-linecap="round"/>

    <!-- strut and dotted return path -->
    <circle cx="320.0" cy="726.0" r="7" fill="#e8822c"/><circle cx="339.2" cy="734.2" r="7" fill="#e8822c"/><circle cx="358.4" cy="741.5" r="7" fill="#e8822c"/><circle cx="377.6" cy="747.9" r="7" fill="#e8822c"/><circle cx="396.8" cy="753.5" r="7" fill="#e8822c"/><circle cx="416.0" cy="758.3" r="7" fill="#e8822c"/><circle cx="608.0" cy="758.3" r="7" fill="#e8822c"/><circle cx="627.2" cy="753.5" r="7" fill="#e8822c"/><circle cx="646.4" cy="747.9" r="7" fill="#e8822c"/><circle cx="665.6" cy="741.5" r="7" fill="#e8822c"/><circle cx="684.8" cy="734.2" r="7" fill="#e8822c"/><circle cx="704.0" cy="726.0" r="7" fill="#e8822c"/>
    <line x1="512" y1="520" x2="512" y2="756" stroke="url(#strut)" stroke-width="32"/>

    <!-- nodes -->
    <circle cx="512" cy="756" r="66" fill="#e8822c" opacity="0.28" filter="url(#glow)"/>
    <circle cx="512" cy="258" r="46" fill="#e8474d"/>
     <circle cx="512" cy="258" r="21" fill="#f7f6f4"/>
    <circle cx="326" cy="696" r="40" fill="#d63f4a"/>
     <circle cx="326" cy="696" r="18" fill="#f7f6f4"/>
    <circle cx="698" cy="696" r="40" fill="#b04360"/>
     <circle cx="698" cy="696" r="18" fill="#f7f6f4"/>
    <circle cx="512" cy="520" r="38" fill="#ef9a2f"/>
     <circle cx="512" cy="520" r="17" fill="#f7f6f4"/>
    <circle cx="512" cy="756" r="50" fill="#e8822c"/>
     <circle cx="512" cy="756" r="22" fill="#f7f6f4"/>

    <rect x="102.5" y="102.5" width="819" height="819" rx="183" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
</svg>