# Guideline Discovery Eval Cases
#
# Each case tests whether an LLM agent, given a realistic task prompt and the
# guideline preamble (injected in the system prompt via guidelinedef.BuildPreamble),
# drills through the index hierarchy to reach LEAF topic files — not just indexes.
#
# Fields:
#   name:              unique test case identifier
#   prompt:            the task prompt sent to the agent
#   language:          the guideline language (e.g. "go") — used to resolve paths
#   expect_read:       paths relative to the language dir that the agent SHOULD
#                      read. Include at least one LEAF file (not an index) to
#                      prove the agent drilled deep enough.
#   not_expect_read:   leaf files the agent should NOT read (unrelated topics)
#   max_turns:         override default of 3

cases:
  - name: "go_error_handling"
    max_turns: 3
    language: go
    prompt: |
      You are writing a Go library that wraps a third-party HTTP API.
      Design the error handling strategy: define sentinel errors, wrap
      errors with context, and handle retryable vs permanent failures.
      Outline your approach and then write a sample implementation.
    expect_read:
      - error-handling/wrapping-and-context.md
      - error-handling/sentinel-and-custom-errors.md
    not_expect_read:
      - concurrency/goroutine-lifecycle.md
      - concurrency/extended-sync.md

  - name: "go_concurrency"
    max_turns: 3
    language: go
    prompt: |
      Implement a Go worker pool that processes jobs from a channel with
      graceful shutdown via context cancellation. The pool must handle
      panics in worker goroutines without crashing the process. Outline
      your approach and then write the implementation.
    expect_read:
      - concurrency/goroutine-lifecycle.md
      - concurrency/channels-and-patterns.md
    not_expect_read:
      - standard-library/encoding-and-strings.md
      - abstractions/dependency-injection.md

  - name: "go_testing"
    max_turns: 3
    language: go
    prompt: |
      Write table-driven tests for a Go configuration parser. The parser
      handles YAML files with schema validation and returns structured
      errors with line numbers. Write comprehensive tests including edge
      cases.
    expect_read:
      - testing/table-driven-tests.md
    not_expect_read:
      - concurrency/goroutine-lifecycle.md
      - concurrency/extended-sync.md
