openapi: 3.1.0
info:
  title: Agentico Server API
  version: v1
  description: Loopback REST and SSE API for the Agentico headless runtime.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read runtime health and launch metadata.
      description: >-
        Liveness-only endpoint (status, runtime identity, launch policy,
        start time, owner, explicit compatibility declaration — no secrets).
        Intentionally exempt from bearer auth so that a stale discovery
        token can't make a live, healthy server look dead to
        PrepareDiscovery, and so clients can evaluate compatibility before
        presenting credentials.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features:
    get:
      operationId: listFeatures
      summary: List feature dashboard summaries.
      responses:
        "200":
          $ref: "#/components/responses/FeatureListResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFeature
      summary: Create a feature.
      description: >-
        Queues server-owned durable setup for the new feature. While mandatory
        readiness is not satisfied (no usable provider, invalid
        configuration), creation is rejected with a structured `not_ready`
        error whose target carries the outstanding readiness issues.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureMutationRequest"
      responses:
        "201":
          $ref: "#/components/responses/ActionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}:
    get:
      operationId: getFeature
      summary: Read one feature.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/FeatureDetailResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/config:
    get:
      operationId: getFeatureConfig
      summary: Read feature configuration.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/FeatureConfigResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: updateFeatureConfig
      summary: Update feature configuration.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/live-preview:
    get:
      operationId: getFeatureLivePreview
      summary: Read a feature's compact live preview.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/LivePreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/reviews:
    get:
      operationId: getReviewSession
      summary: Read the active artifact review draft session without reopening it.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/ReviewSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createReviewSession
      summary: Create or reopen the active artifact review draft session.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ReviewSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/reviews/{review_id}/validate:
    post:
      operationId: validateReviewDraft
      summary: Validate review draft text without modifying the session.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDraftValidationRequest"
      responses:
        "200":
          $ref: "#/components/responses/ReviewDraftValidationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/reviews/{review_id}/draft:
    put:
      operationId: saveReviewDraft
      summary: Replace the draft text for one artifact review session.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDraftUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/ReviewSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/reviews/{review_id}/decision:
    post:
      operationId: submitReviewSessionDecision
      summary: Commit a review draft and submit its review decision.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSessionDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ReviewSessionDecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/features/{feature_id}/rewind/preview:
    get:
      operationId: getRewindPreview
      summary: Read-only, server-authored rewind preview — valid hierarchical targets, effective target, carry-forward set, PR/worktree consequences, backup behavior, and validation findings. No side effects.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - name: target_phase
          in: query
          required: true
          schema:
            type: string
          description: Proposed rewind target phase dir-name.
        - name: roadmap_phase
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Optional partial Implement roadmap phase.
        - name: upgrade_pipeline
          in: query
          required: false
          schema:
            type: string
          description: Optional pipeline upgrade profile.
      responses:
        "200":
          $ref: "#/components/responses/RewindPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/rebase/preflight:
    get:
      operationId: getRebasePreflight
      summary: Read-only, server-authored rebase preflight — every affected repository, target branch, freshness, blocker, and source revision execution will use. No side effects; rejects stale, ineligible, or cross-feature execution before repository mutation.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/RebasePreflightResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/refactor/preflight:
    post:
      operationId: getRefactorPreflight
      summary: Read-only, server-authored refactor scope-resolution preflight — resolves an explicit one-repository or all-repositories choice into the exact repository impact, validates prompt/pipeline bounds, and returns the source revision. No side effects.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefactorPreflightRequest"
      responses:
        "200":
          $ref: "#/components/responses/RefactorPreflightResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/completion/preflight:
    get:
      operationId: getCompletionPreflight
      summary: Read-only, server-authored completion preflight — the exact eligible repository set, already-published or completed outcomes, blockers, PR URLs, and a source revision mutations can reject as stale before side effects. No staging, commits, or arbitrary Git operations.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          $ref: "#/components/responses/CompletionPreflightResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/repositories/{repo_name}/diff:
    get:
      operationId: getRepositoryDiff
      summary: Bounded, lazy, read-only diff inspection for one repository — lists changed files with stable identities, safe display paths, status (addition, modification, deletion, rename, binary, truncation, unavailable), and optional bounded diff content. Rejects traversal and symlink escape; imposes per-request and aggregate limits.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
        - name: file_path
          in: query
          schema:
            type: string
          description: Optional single-file path to fetch bounded diff content for. Without this parameter, the response lists all changed files with summaries only.
      responses:
        "200":
          $ref: "#/components/responses/RepositoryDiffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/repositories/{repo_name}/path:
    get:
      operationId: getRepositoryPath
      summary: Resolve a server-approved repository worktree path for native reveal operations.
      description: >-
        Intended for trusted local desktop main-process use. The renderer calls
        only the narrow reveal IPC with feature and repository identifiers; raw
        host paths remain confined to the authenticated server and Electron main
        process.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/RepositoryPathResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/actions/{action}:
    post:
      operationId: runFeatureAction
      summary: Run a named feature action.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/FeatureAction"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/actions/{action}/{subaction}:
    post:
      operationId: runFeatureSubaction
      summary: Run a named feature subaction.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/FeatureAction"
        - $ref: "#/components/parameters/FeatureSubaction"
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs:
    get:
      operationId: listRuns
      summary: List every sealed and active run for a feature, newest first, with bounded pagination.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/RunListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}:
    get:
      operationId: getRunDetail
      summary: Read run-authentic detail for one run, including seal, provenance, timing, and cost.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
      responses:
        "200":
          $ref: "#/components/responses/RunDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/sessions:
    get:
      operationId: listRunSessions
      summary: List sessions belonging to one run, filtered by run number.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
      responses:
        "200":
          $ref: "#/components/responses/RunSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts for one feature run.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
      responses:
        "200":
          $ref: "#/components/responses/ArtifactListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/artifacts/{artifact_id}:
    get:
      operationId: getArtifactContent
      summary: Read a bounded text artifact slice.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
        - $ref: "#/components/parameters/ArtifactID"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/logs/{log_id}:
    get:
      operationId: getRunLogContent
      summary: Read a bounded run log slice.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
        - $ref: "#/components/parameters/LogID"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/features/{feature_id}/runs/{run_number}/logs:
    get:
      operationId: listRunLogs
      summary: List authentic bounded-text logs discovered inside a run.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
        - $ref: "#/components/parameters/RunNumber"
      responses:
        "200":
          $ref: "#/components/responses/RunLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/config/runtime:
    get:
      operationId: getRuntimeConfig
      summary: Read runtime configuration.
      responses:
        "200":
          $ref: "#/components/responses/RuntimeConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchRuntimeConfig
      summary: Patch runtime configuration.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putRuntimeConfig
      summary: Replace runtime configuration.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/catalog/models:
    get:
      operationId: listModels
      summary: List available provider models.
      responses:
        "200":
          $ref: "#/components/responses/ModelCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/readiness:
    get:
      operationId: getReadiness
      summary: Read consolidated runtime readiness.
      description: >-
        Reports provider executable, version and authentication readiness,
        model availability, configuration validity, workspace-root validity,
        and discovered-repository validity — each with safe remediation
        metadata (for example the CLI command to run). Available in
        setup-capable mode before any provider is usable so first-launch
        clients never probe provider CLIs themselves.
      responses:
        "200":
          $ref: "#/components/responses/ReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/readiness/refresh:
    post:
      operationId: refreshReadiness
      summary: Re-probe provider readiness on demand.
      description: >-
        Re-runs the provider readiness probes (executable detection, version
        gate, authentication) without restarting the runtime, updates active
        model routing, and returns the refreshed readiness snapshot. Call
        after completing an external provider authentication flow.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts:
    get:
      operationId: listPrompts
      summary: List pending prompt requests.
      responses:
        "200":
          $ref: "#/components/responses/PromptSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/ask-user/answer:
    post:
      operationId: answerAskUserPrompt
      summary: Answer an ask-user prompt.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/help/send:
    post:
      operationId: sendHelpPrompt
      summary: Send a help message to a session.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/chat/start:
    post:
      operationId: startChatPrompt
      summary: Start a chat prompt session.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/prompts/chat/end:
    post:
      operationId: endChatPrompt
      summary: End the active singleton chat prompt session.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List pending permission requests.
      responses:
        "200":
          $ref: "#/components/responses/PermissionSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/permissions/answer:
    post:
      operationId: answerPermission
      summary: Answer a permission request.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionAnswerRequest"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List active and recent sessions.
      responses:
        "200":
          $ref: "#/components/responses/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Read a session summary.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          $ref: "#/components/responses/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}/transcript:
    get:
      operationId: getSessionTranscript
      summary: Read a bounded structured session transcript.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TranscriptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}/output/stream:
    get:
      operationId: streamSessionOutput
      summary: Stream indexed transcript records as SSE.
      description: >-
        Emits `session.output` events carrying structured `SessionOutputChunk`
        records — the same transcript rows and index space `/transcript`
        returns — and a terminal `session.output.done` event.
      security:
        - bearerAuth: []
        - sseAccessToken: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: from
          in: query
          required: false
          description: >-
            Resume position expressed as a transcript row index (the same
            index space `/transcript` uses), not a byte offset.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/SessionOutputStream"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/workspace/repositories/init:
    post:
      operationId: initWorkspaceRepository
      summary: Initialize a new git repository inside a configured workspace root.
      description: >-
        Bounded repository-initialization action for first-launch onboarding.
        Requires an explicit consent flag and a target path confined to a
        configured workspace root after symlink resolution. Rejects path
        traversal, symlink escape, targets that are already git repositories,
        and non-empty incompatible directories. On success the repository is
        initialized with an initial empty commit (so HEAD resolves and
        worktree setup can proceed) and is immediately discoverable through
        workspace discovery.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryInitRequest"
      responses:
        "201":
          $ref: "#/components/responses/RepositoryInitResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/recovery:
    get:
      operationId: getRecoverySnapshot
      summary: Scan recoverable sessions.
      responses:
        "200":
          $ref: "#/components/responses/RecoverySnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recovery/actions:
    post:
      operationId: executeRecoveryActions
      summary: Execute recovery actions from a recovery snapshot.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recovery/logs:
    get:
      operationId: getRecoveryLog
      summary: Read a bounded, redacted log slice for one recovery item, resolved through the snapshot and item key. Rejects traversal, cross-item access, and stale snapshots; never returns raw host paths.
      parameters:
        - $ref: "#/components/parameters/RecoverySnapshotID"
        - $ref: "#/components/parameters/RecoveryItemKey"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/shutdown:
    post:
      operationId: shutdownRuntime
      summary: Request runtime shutdown.
      parameters:
        - $ref: "#/components/parameters/TrustedMutationHeader"
      requestBody:
        $ref: "#/components/requestBodies/JSONMutation"
      responses:
        "200":
          $ref: "#/components/responses/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Stream ordered runtime events as SSE.
      description: Emits envelope JSON under SSE `data:` lines. Every non-control event includes a monotonic `seq`, `epoch`, resource identity, and resource version. Clients resume with `Last-Event-ID` or `after`.
      security:
        - bearerAuth: []
        - sseAccessToken: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            x-go-type: uint64
            minimum: 0
        - name: epoch
          in: query
          required: false
          schema:
            type: string
        - name: heartbeat_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: instance-token
      description: Per-instance token from discovery metadata.
    sseAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: SSE fallback for browser EventSource clients that cannot set Authorization.

  parameters:
    FeatureID:
      name: feature_id
      in: path
      required: true
      schema:
        type: string
    RunNumber:
      name: run_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
    ReviewID:
      name: review_id
      in: path
      required: true
      schema:
        type: string
    LogID:
      name: log_id
      in: path
      required: true
      schema:
        type: string
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    FeatureAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum:
          - setup
          - start
          - resume
          - pause-stop
          - restart
          - publish
          - merge
          - rewind
          - retry
          - rebase
          - review-comments
          - review-decision
          - refactor
          - need-user-input
          - need-user-input-draft
          - mark-done
          - cleanup
          - delete
    FeatureSubaction:
      name: subaction
      in: path
      required: true
      schema:
        type: string
        enum:
          - description
          - fetch
          - finish
          - restart
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: 1-indexed page number for run-history pagination.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Bounded page size for run-history pagination.
    TrustedMutationHeader:
      name: X-Agentico-Client
      in: header
      required: true
      schema:
        type: string
        enum: ["local"]
      description: CSRF defense-in-depth for local browser-origin mutations. Bearer auth is still required.
    RecoverySnapshotID:
      name: snapshot_id
      in: query
      required: true
      schema:
        type: string
      description: Recovery snapshot identity returned by GET /api/v1/recovery.
    RecoveryItemKey:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: Recovery item key (feature id, or feature id and repo name joined by a colon).

  requestBodies:
    JSONMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    HealthResponse:
      description: Runtime health.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    FeatureListResponse:
      description: Feature list.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureListResponse"
    FeatureDetailResponse:
      description: Feature detail.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureDetailResponse"
    FeatureConfigResponse:
      description: Feature config.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureConfigResponse"
    RuntimeConfigResponse:
      description: Runtime config.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeConfigResponse"
    ModelCatalogResponse:
      description: Model catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelCatalogResponse"
    PromptSnapshotResponse:
      description: Pending prompt snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptSnapshotResponse"
    PermissionSnapshotResponse:
      description: Pending permission snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionSnapshotResponse"
    ArtifactListResponse:
      description: Artifact list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactListResponse"
    TextContentResponse:
      description: Bounded text content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TextContentResponse"
    RunLogListResponse:
      description: Authentic log files available within one run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunLogListResponse"
    RunListResponse:
      description: Paginated run history, newest first.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunListResponse"
    RunDetailResponse:
      description: Run-authentic detail for one run.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunDetailResponse"
    RunSessionListResponse:
      description: Sessions belonging to one run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunSessionListResponse"
    RewindPreviewResponse:
      description: Server-authored, side-effect-free rewind preview.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RewindPreviewResponse"
    ReviewSessionResponse:
      description: Artifact review draft session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewSessionResponse"
    ReviewSessionDecisionResponse:
      description: Artifact review draft decision result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewSessionDecisionResponse"
    ReviewDraftValidationResponse:
      description: Advisory validation result for review draft text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewDraftValidationResponse"
    LivePreviewResponse:
      description: Live preview.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LivePreviewResponse"
    SessionListResponse:
      description: Session list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionListResponse"
    SessionDetailResponse:
      description: Session detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionDetailResponse"
    TranscriptResponse:
      description: Structured transcript.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscriptResponse"
    RecoverySnapshotResponse:
      description: Recovery snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecoverySnapshotResponse"
    RebasePreflightResponse:
      description: Read-only, server-authored rebase preflight.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RebasePreflightResponse"
    RefactorPreflightResponse:
      description: Read-only, server-authored refactor scope-resolution preflight.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefactorPreflightResponse"
    CompletionPreflightResponse:
      description: Read-only, server-authored completion preflight — eligible repository set, outcomes, blockers, PR URLs, source revision.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompletionPreflightResponse"
    RepositoryDiffResponse:
      description: Bounded, lazy, read-only diff inspection for one repository.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryDiffResponse"
    RepositoryPathResponse:
      description: Server-approved repository worktree path for desktop main-process reveal.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryPathDTO"
    ReadinessResponse:
      description: Consolidated runtime readiness snapshot.
      headers:
        X-Agentico-Seq:
          $ref: "#/components/headers/Sequence"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReadinessResponse"
    RepositoryInitResponse:
      description: Newly initialized workspace repository.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryInitResponse"
    ActionResponse:
      description: Mutation result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionResponse"
    ErrorResponse:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotModified:
      description: Snapshot revision matches the supplied validator.
    EventStream:
      description: Runtime SSE stream carrying `SSEEvent` JSON envelopes.
      content:
        text/event-stream:
          schema:
            $ref: "#/components/schemas/SSEEvent"
    SessionOutputStream:
      description: Session output SSE stream carrying `SessionOutputChunk` JSON payloads.
      content:
        text/event-stream:
          schema:
            $ref: "#/components/schemas/SessionOutputChunk"

  headers:
    Sequence:
      description: Current event broker sequence at response time.
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Snapshot revision validator.
      schema:
        type: string

  schemas:
    ResponseMeta:
      type: object
      required: [revision, generated_at, as_of_seq]
      properties:
        revision:
          type: string
        generated_at:
          type: string
          format: date-time
        as_of_seq:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
    ErrorResponse:
      type: object
      required: [api_version, error]
      properties:
        api_version:
          type: string
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message, status]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        target:
          type: object
          additionalProperties: true
    PermissionAnswerRequest:
      x-go-name: PermissionAnswerSchema
      type: object
      required: [request_id, decision]
      properties:
        request_id:
          type: string
        session_id:
          type: string
        decision:
          type: string
          enum: [allow_once, allow_remember, deny]
        remember_pattern:
          type: string
        remember_scope:
          type: string
          description: Existing permission cache scope. Empty string means global.
          x-go-type-skip-optional-pointer: false
    Resource:
      type: object
      required: [type]
      properties:
        type:
          type: string
        id:
          type: string
        feature_id:
          type: string
        phase:
          type: string
    SSEEvent:
      type: object
      required: [api_version, id, kind, at, resource, snapshot_required]
      properties:
        api_version:
          type: string
        id:
          type: string
        seq:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
        epoch:
          type: string
        kind:
          type: string
        at:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/Resource"
        resource_version:
          type: integer
          format: int64
          x-go-type: uint64
          minimum: 0
        revision:
          type: string
        snapshot_required:
          type: boolean
        summary:
          type: string
        record_count:
          type: integer
          description: >-
            Session's current transcript record count at emission time — the
            same index space /transcript and /output/stream use. Only set on
            session.output.activity events.
    SessionOutputChunk:
      type: object
      required: [api_version, index]
      properties:
        api_version:
          type: string
        session_id:
          type: string
        index:
          type: integer
          description: >-
            Transcript row index — the same index space /transcript and
            session.output.activity's record_count use. Not a byte offset.
        message:
          $ref: "#/components/schemas/TranscriptMessage"
          description: A TranscriptMessageDTO row (see the /transcript response).
        done:
          type: boolean
    JSONResponse:
      type: object
      required: [api_version]
      properties:
        api_version:
          type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required:
            [
              status,
              runtime,
              launch_policy,
              started_at,
              owner,
              server_time,
              compatibility,
            ]
          properties:
            status:
              type: string
            runtime:
              $ref: "#/components/schemas/RuntimeIdentity"
            launch_policy:
              $ref: "#/components/schemas/LaunchPolicy"
            started_at:
              type: string
              format: date-time
            owner:
              $ref: "#/components/schemas/Owner"
            server_time:
              type: string
              format: date-time
            compatibility:
              $ref: "#/components/schemas/CompatibilityDeclaration"
    BuildIdentity:
      type: object
      description: >-
        Build provenance for one side of the desktop/server pairing. Purely
        informational: a differing build identity alone never blocks
        attachment — compatibility is decided by the explicit declaration
        fields, not by comparing versions.
      required: [version]
      properties:
        version:
          type: string
          description: Human-readable build version (e.g. a git describe string).
        revision:
          type: string
          description: VCS revision the binary was built from, when known.
    CompatibilityDeclaration:
      type: object
      description: >-
        The server's explicit compatibility contract. Clients (such as the
        desktop app) must attach only when they support the declared
        (api_version, schema_version) REST contract AND the declared
        runtime_policy, and when their own client schema version is at least
        min_client_schema. A shared API major version alone is never
        sufficient. Contains no secrets.
      required:
        [
          api_version,
          schema_version,
          min_client_schema,
          runtime_policy,
          server_build,
        ]
      properties:
        api_version:
          type: string
          description: The REST API major version this server serves (e.g. "v1").
        schema_version:
          type: integer
          description: >-
            Monotonic series number of the REST schema contract within the
            API major. Bumped whenever the wire schema changes incompatibly.
        min_client_schema:
          type: integer
          description: >-
            The minimum client schema series a connecting client must
            implement for this server to consider it compatible.
        runtime_policy:
          type: string
          description: >-
            Name of the runtime security/ownership policy contract in force
            (e.g. "loopback-bearer-v1" — loopback-only listener with bearer
            token auth and single-owner discovery).
        server_build:
          $ref: "#/components/schemas/BuildIdentity"
    ReadinessIssueCode:
      type: string
      description: >-
        Readiness problem taxonomy. missing_executable — a provider CLI binary
        is not installed; unsupported_version — an installed provider CLI is
        below the enforced minimum version; unauthenticated — a provider CLI
        is installed but its authentication flow has not been completed;
        models_unavailable — no usable provider exposes any model;
        invalid_configuration — the runtime configuration is unusable;
        invalid_workspace_root — a configured workspace root does not resolve
        to a directory; invalid_repository — a configured repository path is
        not a git repository.
      enum:
        - missing_executable
        - unsupported_version
        - unauthenticated
        - models_unavailable
        - invalid_configuration
        - invalid_workspace_root
        - invalid_repository
    ReadinessIssue:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ReadinessIssueCode"
        message:
          type: string
          description: Human-readable problem summary. Never contains credentials.
        remedy:
          type: string
          description: >-
            Safe remediation metadata, such as the CLI command to run. Never
            contains credentials or non-configured filesystem paths.
    ProviderReadiness:
      type: object
      required: [name, installed, ready]
      properties:
        name:
          type: string
        installed:
          type: boolean
        version:
          type: string
        ready:
          type: boolean
        issue:
          $ref: "#/components/schemas/ReadinessIssue"
          x-go-type-skip-optional-pointer: false
    ModelReadiness:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        models:
          type: array
          items:
            type: string
        issue:
          $ref: "#/components/schemas/ReadinessIssue"
          x-go-type-skip-optional-pointer: false
    ConfigurationReadiness:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        issue:
          $ref: "#/components/schemas/ReadinessIssue"
          x-go-type-skip-optional-pointer: false
    WorkspaceRootReadiness:
      type: object
      required: [path, valid]
      properties:
        path:
          type: string
        valid:
          type: boolean
        issue:
          $ref: "#/components/schemas/ReadinessIssue"
          x-go-type-skip-optional-pointer: false
    RepositoryReadiness:
      type: object
      required: [name, path, valid]
      properties:
        name:
          type: string
        path:
          type: string
        valid:
          type: boolean
        issue:
          $ref: "#/components/schemas/ReadinessIssue"
          x-go-type-skip-optional-pointer: false
    RepositoryInitRequest:
      x-go-name: RepositoryInitSchema
      type: object
      required: [path, consent]
      properties:
        path:
          type: string
          description: >-
            Absolute directory to initialize, confined to a configured
            workspace root. May not yet exist; an existing directory must be
            empty and not already a git repository.
        consent:
          type: boolean
          description: >-
            Explicit user consent to create a git repository at the target
            path. Must be true.
    WorkspaceRepository:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Collision-safe repository key used by workspace discovery.
        path:
          type: string
        root:
          type: string
          description: The configured workspace root containing the repository.
    RepositoryInitResponse:
      allOf:
        - $ref: "#/components/schemas/ActionBaseResponse"
        - type: object
          required: [result, repository]
          properties:
            result:
              type: string
            repository:
              $ref: "#/components/schemas/WorkspaceRepository"
    WorkspaceReadiness:
      type: object
      required: [roots, repositories]
      properties:
        roots:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRootReadiness"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryReadiness"
    ReadinessResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [ready, providers, models, configuration, workspace]
          properties:
            ready:
              type: boolean
              description: >-
                Mandatory readiness — true when at least one provider is
                usable, models are available, and the configuration is valid.
                Feature creation is gated on this value.
            probed_at:
              type: string
              format: date-time
              x-go-type-skip-optional-pointer: false
              description: When provider probes last ran.
            providers:
              type: array
              items:
                $ref: "#/components/schemas/ProviderReadiness"
            models:
              $ref: "#/components/schemas/ModelReadiness"
            configuration:
              $ref: "#/components/schemas/ConfigurationReadiness"
            workspace:
              $ref: "#/components/schemas/WorkspaceReadiness"
            issues:
              type: array
              description: Flattened outstanding issues across all sections.
              items:
                $ref: "#/components/schemas/ReadinessIssue"
    FeatureListResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [features]
          properties:
            features:
              type: array
              items:
                $ref: "#/components/schemas/FeatureSummary"
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/Warning"
    FeatureDetailResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [feature]
          properties:
            feature:
              $ref: "#/components/schemas/FeatureDetail"
    FeatureConfigResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [feature_id, current, defaults, original, publishability]
          properties:
            feature_id:
              type: string
            current:
              $ref: "#/components/schemas/FeatureConfig"
            defaults:
              $ref: "#/components/schemas/FeatureConfig"
            original:
              $ref: "#/components/schemas/FeatureConfig"
            publishability:
              $ref: "#/components/schemas/Publishability"
              x-go-name: Publish
    RuntimeConfigResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required:
            - runtime
            - model_defaults
            - feature_defaults
            - repos
            - ui
            - notifications
            - observability
            - providers
          properties:
            runtime:
              $ref: "#/components/schemas/RuntimeIdentity"
            model_defaults:
              $ref: "#/components/schemas/ModelDefaults"
              x-go-name: Defaults
            feature_defaults:
              $ref: "#/components/schemas/FeatureDefaults"
            repos:
              type: array
              items:
                $ref: "#/components/schemas/ConfigRepo"
            workspace_roots:
              type: array
              items:
                type: string
            notifications:
              $ref: "#/components/schemas/NotificationConfig"
            observability:
              $ref: "#/components/schemas/Observability"
            providers:
              type: array
              items:
                type: string
    ModelCatalogResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required:
            [
              provider_order,
              provider_models,
              phase_defaults,
              phase_provider_models,
            ]
          properties:
            provider_order:
              type: array
              items:
                type: string
            provider_models:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
            phase_defaults:
              $ref: "#/components/schemas/ModelDefaults"
            phase_provider_models:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    PromptSnapshotResponse:
      allOf:
        - $ref: "#/components/schemas/JSONResponse"
        - type: object
          required: [ask_user_questions, help_queue, need_user_inputs]
          properties:
            ask_user_questions:
              type: array
