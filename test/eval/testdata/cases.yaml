# Skill Discovery Eval Cases
#
# Each case tests whether an LLM agent, given a realistic task prompt and an
# advisory table of available skills (injected in the system prompt via
# BuildPreamble), voluntarily reads the relevant SKILL.md files.
#
# Fields:
#   name:            unique test case identifier
#   prompt:          the task prompt sent to the agent
#   expect_read:     skill names the agent SHOULD read (pass = all read)
#   not_expect_read: skill names the agent should NOT read (pass = none read)

cases:
  - name: "desktop_ui_implementation"
    max_turns: 2
    prompt: |
      You are working on the Agentic Electron desktop app (React and TypeScript).
      Implement a new dashboard widget that shows feature progress as a
      bar chart with color-coded status indicators.

      Outline your implementation approach first, then write the code.
    expect_read:
      - frontend-design
    not_expect_read:
      - validate-plan-security

  - name: "security_review"
    max_turns: 2
    prompt: |
      Review this implementation plan for a new authentication system
      that handles OAuth tokens and session management. Identify security
      concerns, potential vulnerabilities, and suggest improvements.
    expect_read:
      - validate-plan-security
    not_expect_read:
      - frontend-design

  - name: "implementation_task"
    max_turns: 2
    prompt: |
      Implement a YAML configuration file parser in Go that validates
      schemas and reports errors with line numbers. Write the code.
    expect_read:
      - implement
    not_expect_read:
      - frontend-design
      - validate-plan-security
