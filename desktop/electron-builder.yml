# Packaging configuration. Actual signed/packaged release jobs land in a later
# task; this config exists so `electron-builder` can already produce artifacts.
appId: com.doordash.agentico
productName: Agentico
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
