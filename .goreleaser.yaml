version: 2

project_name: agentic-orchestrator

builds:
  - main: ./cmd/agentico
    binary: agentico
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/doordash-oss/agentic-orchestrator/internal/buildinfo.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # Fold every desktop package (built and verified before goreleaser runs —
  # see `make release`) into checksums.txt so the in-app updater can match its
  # AppImage against signed metadata. DEBs are package-manager managed.
  extra_files:
    - glob: desktop/dist/Agentico-mac-universal.dmg
    - glob: desktop/dist/Agentico-x64.AppImage
    - glob: desktop/dist/Agentico-arm64.AppImage
    - glob: desktop/dist/agentico_{{ .Version }}_amd64.deb
    - glob: desktop/dist/agentico_{{ .Version }}_arm64.deb

# Detached Ed25519 signature over checksums.txt in the exact format the
# desktop updater verifies (agentico-ed25519:<base64>). The signer refuses to
# run with a key that does not match the trust root embedded in the app.
signs:
  - cmd: node
    args: ["desktop/scripts/release-sign.mjs", "sign", "${artifact}"]
    artifacts: checksum
    signature: "${artifact}.sig"

changelog:
  # NOTE: do NOT set disable: true here — it also suppresses --release-notes.
  # The --release-notes flag naturally skips auto-generation when provided.
  sort: asc

release:
  github:
    owner: doordash-oss
    name: agentic-orchestrator
  extra_files:
    - glob: desktop/dist/Agentico-mac-universal.dmg
    - glob: desktop/dist/Agentico-x64.AppImage
    - glob: desktop/dist/Agentico-arm64.AppImage
    - glob: desktop/dist/agentico_{{ .Version }}_amd64.deb
    - glob: desktop/dist/agentico_{{ .Version }}_arm64.deb

# Homebrew distribution of the CLI. Casks replaced formulas for pre-compiled
# binaries (brews is deprecated since goreleaser v2.10); the desktop app cask
# (agentico-desktop) is published separately by
# desktop/scripts/publish-desktop-cask.mjs because the OSS cask pipe cannot
# checksum artifacts goreleaser did not build.
homebrew_casks:
  - name: agentico
    repository:
      owner: doordash-oss
      name: homebrew-agentic-orchestrator
      branch: main
    homepage: "https://github.com/doordash-oss/agentic-orchestrator"
    description: "Desktop-first parallel agentic coding orchestrator"
    license: "Apache-2.0"
    # The tarball binary is not Developer ID-signed; Homebrew quarantines its
    # downloads, and Gatekeeper refuses quarantined unsigned binaries. Remove
    # once releases are signed/notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentico"]
          end
